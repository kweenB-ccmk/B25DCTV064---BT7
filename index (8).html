<style>

  box-sizing:border-box;
  --bg:#ffffff; --bg-soft:#fff4f5; --card:#ffffff; --border:#f0d8db;
  --red:#c11f36; --red-dark:#8c1327; --ink:#211414; --muted:#7a6564;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --bg:#1c1112; --bg-soft:#241618; --card:#241618; --border:#3d2528;
  --red:#e2445c; --red-dark:#ff6b80; --ink:#f4e9e9; --muted:#c6adac;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth; scroll-padding-top:70px; height:100%;}
body{
  font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.6;

img{max-width:100%; display:block;}
a{color:inherit; text-decoration:none;}
.wrap{max-width:1040px; margin:0 auto; padding:0 24px;}
h1,h2,h3{font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; font-weight:700; letter-spacing:-.01em;}
.sans{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;}

/* header */
header{

.nav-row{display:flex; align-items:center; justify-content:space-between; height:64px;}
.brand{font-size:1.3rem; font-weight:700; color:var(--red);}
nav ul{list-style:none; display:flex; gap:28px;}
nav a{font-family:-apple-system,'Segoe UI',Roboto,sans-serif; font-size:.95rem; color:var(--ink); padding:6px 2px; border-bottom:2px solid transparent; transition:border-color .2s, color .2s;}
nav a:hover{color:var(--red); border-color:var(--red);}
.nav-actions{display:flex; align-items:center; gap:14px;}
#themeBtn{

}
#themeBtn:hover{transform:scale(1.08);}
#hamburger{display:none; flex-direction:column; gap:5px; background:none; border:none; cursor:pointer; padding:6px;}

.avatar-wrap{position:relative; width:200px; height:200px; margin:0 auto;}
#avatarImg{

#toast{

// Hook hiệu ứng hiện dần khi cuộn tới phần tử (thay cho IntersectionObserver trong script.js cũ)
function useReveal() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(
      ([entry]) => {
        if (entry.isIntersecting) {
          el.classList.add('visible');
          io.unobserve(el);
        }
      },
      { threshold: 0.15 }
    );
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return ref;
}


// Component bọc dùng children: tiêu đề + mô tả + nội dung bên trong
function Section({ id, title, subtitle, subClass = 'section-sub', style, children }) {

        <h2 className="section-title reveal" ref={titleRef}>{title}</h2>
        {subtitle && <p className={`${subClass} reveal`} ref={subRef}>{subtitle}</p>}
        {children}
      </div>
    </section>
  );
}

}


function Hero({ profile, defaultAvatar }) {
  const inputRef = useRef(null);
  const [avatar, setAvatar] = useState(() => {
    try { return localStorage.getItem('quyen-avatar') || defaultAvatar; } catch (e) { return defaultAvatar; }
  });

  const handleFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      setAvatar(ev.target.result);
      try { localStorage.setItem('quyen-avatar', ev.target.result); } catch (err) {}
    };
    reader.readAsDataURL(file);
  };

  return (
    <section className="hero" id="about">
      <div className="wrap hero-grid">
        <div className="avatar-wrap">
          <img id="avatarImg" src={avatar} alt={`Ảnh đại diện ${profile.name}`} onClick={() => inputRef.current.click()} />
          <span className="avatar-hint">Nhấn để đổi ảnh</span>
          <input type="file" accept="image/*" style={{ display: 'none' }} ref={inputRef} onChange={handleFile} />
        </div>
        <div>
          <h1>Xin chào, mình là Quyên!</h1>
          <p className="role sans">{profile.role}</p>
          <ul className="facts">
            {profile.facts.map((f) => <li key={f}>{f}</li>)}
          </ul>
          <p className="bio">{profile.bio}</p>
        </div>
      </div>
    </section>
  );

function Projects({ projects, filters }) {
  const [query, setQuery] = useState('');
  const [activeTag, setActiveTag] = useState('all');

  const q = query.trim().toLowerCase();
  const visible = projects.filter((p) => {
    const text = `${p.title} ${p.desc} ${p.label} ${p.tags}`.toLowerCase();
    const matchesTag = activeTag === 'all' || p.tags.includes(activeTag);
    return matchesTag && (q === '' || text.includes(q));
  });

  return (
    <>
      <div className="filter-row">
        <input
          type="text"
          id="projSearch"
          placeholder="Tìm dự án theo từ khóa hoặc tag..."
          value={query}
          onChange={(e) => setQuery(e.target.value)}
        />
        {filters.map((f) => (
          <button
            key={f.tag}
            className={`tag-btn${activeTag === f.tag ? ' active' : ''}`}
            onClick={() => setActiveTag(f.tag)}
          >
            {f.label}
          </button>
        ))}
      </div>
      <div className="proj-grid">
        {visible.map((p) => <ProjectCard key={p.title} {...p} />)}
      </div>
      {visible.length === 0 && <p className="no-result" style={{ display: 'block' }}>Không tìm thấy dự án phù hợp.</p>}
    </>
  );
}

    const fullname = values.fullname.trim();
    const errs = {};
    if (fullname.length < 2) errs.fullname = 'Vui lòng nhập họ và tên hợp lệ.';
    if (!/^0\d{9}$/.test(values.phone.trim())) errs.phone = 'Số điện thoại phải gồm 10 số, bắt đầu bằng 0.';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(values.email.trim())) errs.email = 'Email không đúng định dạng.';
    if (values.message.trim().length < 5) errs.message = 'Lời nhắn cần ít nhất 5 kí tự.';
    setErrors(errs);

    if (Object.keys(errs).length === 0) {
      setToast({ show: true, text: `Đã gửi tin nhắn thành công! Cảm ơn ${fullname}, mình sẽ phản hồi sớm nhất có thể.` });
      clearTimeout(timer.current);
      timer.current = setTimeout(() => setToast((t) => ({ ...t, show: false })), 4000);
      setValues(empty);
    }
  };

  return (
    <div className="contact-wrap">
      <form id="contactForm" className="reveal" ref={formRef} noValidate onSubmit={onSubmit}>
        <div className="field">
          <label htmlFor="fullname">Họ và tên</label>
          <input type="text" id="fullname" name="fullname" value={values.fullname} onChange={onChange} />
          <span className="err">{errors.fullname}</span>
        </div>
        <div className="field">
          <label htmlFor="phone">Số điện thoại</label>
          <input type="text" id="phone" name="phone" value={values.phone} onChange={onChange} />
          <span className="err">{errors.phone}</span>
        </div>
        <div className="field">
          <label htmlFor="email">Email</label>
          <input type="text" id="email" name="email" value={values.email} onChange={onChange} />
          <span className="err">{errors.email}</span>
        </div>
        <div className="field">
          <label htmlFor="message">Lời nhắn</label>
          <textarea id="message" name="message" rows="4" maxLength="300" value={values.message} onChange={onChange} />
          <div className="charcount">{values.message.length}/300</div>
          <span className="err">{errors.message}</span>
        </div>
        <button type="submit" id="submitBtn">Gửi lời nhắn</button>
        <p id="formStatus"></p>
      </form>

      <div id="toast" className={toast.show ? 'show' : ''}>
        <span className="tick">✅</span><span>{toast.text}</span>
      </div>

      <div className="contact-info reveal" ref={infoRef}>
        <h3>Thông tin liên hệ</h3>
        {info.map((line) => <p key={line}>{line}</p>)}
      </div>
    </div>
  );
}

function Footer({ name }) {
  return (
    <footer>
      <p>© {new Date().getFullYear()} {name}. Được tạo với ❤ bởi chính mình.</p>
    </footer>
  );
}


const softBg = { background: 'var(--bg-soft)', borderTop: '1px solid var(--border)' };

function App() {
  const [theme, setTheme] = useState(() => {
    try { return localStorage.getItem('quyen-theme') || 'light'; } catch (e) { return 'light'; }
  });

  useEffect(() => {
    const root = document.documentElement;
    if (theme === 'dark') root.setAttribute('data-theme', 'dark');
    else root.removeAttribute('data-theme');
    try { localStorage.setItem('quyen-theme', theme); } catch (e) {}
  }, [theme]);

  return (
    <>
      <Header items={navItems} theme={theme} onToggleTheme={() => setTheme(theme === 'dark' ? 'light' : 'dark')} />
      <Hero profile={profile} defaultAvatar={defaultAvatar} />

      <Section id="skills" title="Kĩ năng" subtitle="Những gì mình đã và đang rèn luyện">
        <div className="skills-grid">
          {skills.map((s) => <SkillCard key={s.title} title={s.title} desc={s.desc} />)}
        </div>
      </Section>

      <Section
        id="projects"
        title="Dự án"
        subtitle="Một vài sản phẩm mình đã thực hiện — gõ từ khóa hoặc chọn thẻ để lọc"
        style={{ ...softBg, borderBottom: '1px solid var(--border)' }}
      >
        <Projects projects={projects} filters={projectFilters} />
      </Section>

      <Section id="hobbies" title="Sở thích" subtitle="Những điều mình yêu thích ngoài giờ học">
        <Hobbies hobbies={hobbies} />
      </Section>

      <Section
        id="contact"
        title="Liên hệ với tôi"
        subtitle="Để lại lời nhắn, mình sẽ phản hồi sớm nhất có thể!"
        subClass="contact-note"
        style={softBg}
      >
        <Contact info={contactInfo} />
      </Section>

      <Footer name={profile.name} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
